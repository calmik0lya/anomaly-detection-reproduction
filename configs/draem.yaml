# Конфиг для DRAEM/train_DRAEM.py + DRAEM/test_DRAEM.py
model: draem
python_env: patchcore          # ключ из configs/paths.yaml -> python_envs
working_dir: DRAEM
train_script: train_DRAEM.py

category: bottle
epochs: 8
lr: 0.0001
bs: 8

checkpoint_path: checkpoints
log_path: logs

env: {}

# Тот же порядок категорий, что и obj_batch в train_DRAEM.py — нужен, чтобы
# перевести category в --obj_id, который ждёт скрипт.
obj_list:
  - capsule
  - bottle
  - carpet
  - leather
  - pill
  - transistor
  - tile
  - cable
  - zipper
  - toothbrush
  - metal_nut
  - hazelnut
  - screw
  - grid
  - wood

# test_DRAEM.test() печатает "AUC Image: ..." и "AUC Pixel: ..." в stdout.
metrics_source:
  type: regex_stdout
  patterns:
    image_auroc: 'AUC Image:\s*([\d.]+)'
    pixel_auroc: 'AUC Pixel:\s*([\d.]+)'

# train_DRAEM.py сохраняет веса как (см. строки 102-103):
# {checkpoint_path}/{run_name}.pckl и {checkpoint_path}/{run_name}_seg.pckl,
# где run_name = "DRAEM_test_{lr}_{epochs}_bs{bs}_{category}_"
weight_glob:
  - "{checkpoint_path}/{run_name}.pckl"
  - "{checkpoint_path}/{run_name}_seg.pckl"
