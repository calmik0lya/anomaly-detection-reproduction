# Конфиг для padim_run/run_padim.py
#
# ВАЖНО: run_padim.py ничего не принимает через CLI — категория, датасет,
# backbone, epochs и batch size зашиты внутри самого скрипта (мы его не
# трогаем, см. задание). Поля ниже, кроме category/python_env/working_dir,
# существуют только как справочная документация того, что реально зашито
# в run_padim.py — run.py их не подставляет в команду.
model: padim
python_env: anomalib           # ключ из configs/paths.yaml -> python_envs
working_dir: padim_run
script: run_padim.py

category: bottle                # должно совпадать с тем, что зашито в run_padim.py

env: {}

# Справочно — реальные значения зашиты в run_padim.py:
hardcoded_reference:
  backbone: resnet18
  layers_to_extract_from: [layer1, layer2, layer3]
  train_batch_size: 32
  eval_batch_size: 32
  num_workers: 0
  max_epochs: 1

# run_padim.py сам пишет metrics.json рядом с собой.
metrics_source:
  type: json
  path: metrics.json
  fields:
    image_auroc: image_AUROC
    pixel_auroc: pixel_AUROC

# anomalib Engine(default_root_dir=.../padim_run/results) кладёт чекпоинты в
# <default_root_dir>/<Model>/<Datamodule>/<category>/latest/weights/lightning/*.ckpt
# (см. ModelCheckpoint(dirpath=default_root_dir/"weights"/"lightning") в
# anomalib/engine/engine.py и папки padim_run/results/Padim/MVTecAD/bottle/{v0,latest}).
weight_glob:
  - "results/Padim/MVTecAD/{category}/latest/weights/lightning/*.ckpt"
  - "results/Padim/MVTecAD/{category}/v*/weights/lightning/*.ckpt"
