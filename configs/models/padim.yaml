name: padim
python_env: anomalib
working_dir: models/padim
script: run_padim.py
env: {}

backbone: resnet18
layers_to_extract_from: [layer1, layer2, layer3]
train_batch_size: 32
eval_batch_size: 32
num_workers: 0
epochs: 1
accelerator: cpu
devices: 1
results_dir: results

weight_glob:
  - "results/Padim/MVTecAD/{category}/latest/weights/lightning/*.ckpt"
  - "results/Padim/MVTecAD/{category}/v*/weights/lightning/*.ckpt"
