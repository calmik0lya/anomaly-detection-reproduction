# Пути внутри Kaggle Notebook. При другом slug подключённого Dataset
# достаточно исправить только эти две строки.
mvtec_path: /kaggle/input/mvtec-ad/mvtec_anomaly_detection
dtd_images_path: /kaggle/input/describable-textures-dataset-dtd/dtd/images

# Kaggle использует одно окружение с CUDA. Разделение сохранено под теми же
# логическими именами, чтобы модельные конфиги оставались общими с macOS.
python_envs:
  patchcore: python
  anomalib: python
