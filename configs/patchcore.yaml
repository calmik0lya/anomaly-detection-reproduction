# Конфиг для patchcore-inspection/bin/run_patchcore.py
model: patchcore
python_env: patchcore          # ключ из configs/paths.yaml -> python_envs
working_dir: patchcore-inspection
script: bin/run_patchcore.py

category: bottle
seed: 0
save_patchcore_model: true

log_project: MVTecAD_Results
log_group_template: "IM224_WR50_{category}"
results_dir_template: "results_{category}"

backbone: wideresnet50
layers_to_extract_from: [layer2, layer3]
pretrain_embed_dimension: 1024
target_embed_dimension: 1024
anomaly_scorer_num_nn: 1
patchsize: 3

sampler: approx_greedy_coreset
sampler_percentage: 0.1

num_workers: 0
resize: 256
imagesize: 224

env:
  PYTHONPATH: src
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

# Откуда парсить метрики после запуска (run_patchcore.py сам пишет results.csv).
metrics_source:
  type: csv
  path_template: "{results_dir}/{log_project}/{log_group}/results.csv"

# Куда PatchCore.save_to_path() реально кладёт веса (см. src/patchcore/patchcore.py
# и src/patchcore/common.py): {results_dir}/{log_project}/{log_group}/models/mvtec_{category}/
# -> patchcore_params.pkl, nnscorer_search_index.faiss, (nnscorer_features.pkl).
weight_glob:
  - "{results_dir}/{log_project}/{log_group}/models/mvtec_{category}/*"
