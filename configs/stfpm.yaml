# Конфиг для STFPM/main.py
model: stfpm
python_env: patchcore          # ключ из configs/paths.yaml -> python_envs
working_dir: STFPM
script: main.py

category: bottle
epochs: 100
model_save_path: snapshots

env: {}

# main.py test печатает строку "Pixel-AUC: ... Image-AUC: ... PRO: ..." в stdout.
metrics_source:
  type: regex_stdout
  pattern: 'Pixel-AUC:\s*([\d.]+)\s*Image-AUC:\s*([\d.]+)\s*PRO:\s*([\d.]+)'
  fields: [pixel_auroc, image_auroc, pro_auroc]

# main.py train сохраняет чекпоинт студента (см. STFPM/main.py, save_name):
# {model_save_path}/{category}/best.pth.tar
weight_glob:
  - "{model_save_path}/{category}/best.pth.tar"
